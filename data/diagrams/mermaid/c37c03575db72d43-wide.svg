<svg id="mmd-c37c03575db72d43-wide" width="184" xmlns="http://www.w3.org/2000/svg" class="flowchart" height="649.5" viewBox="4 4 184 649.5" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-mmd-c37c03575db72d43-wide" aria-labelledby="chart-title-mmd-c37c03575db72d43-wide"><title id="chart-title-mmd-c37c03575db72d43-wide">되감기 조각을 정한 순서</title><desc id="chart-desc-mmd-c37c03575db72d43-wide">8월 19일 시험에서 오류 없이 61.94초가 빠졌다. 같은 날 시간축 정규화를 넣어 다시 짓기로 했고 계획은 묶음 파일의 tfdt를 제자리에서 고치는 것이었다. 8월 21일 라이브와 되감기는 소리 하나로 정했다. 8월 28일 되감기용 조각을 따로 만들고 원본은 클립용으로 두기로 했다. 8월 30일 재현으로 원인을 tfdt로 좁혔고 9월 19일 Go 재포장과 mtxi 더하기 보정값 도장으로 정했다.</desc><style>#mmd-c37c03575db72d43-wide{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:15px;fill:var(--ink);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-c37c03575db72d43-wide .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-c37c03575db72d43-wide .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-c37c03575db72d43-wide .error-icon{fill:var(--bg);}#mmd-c37c03575db72d43-wide .error-text{fill:var(--ink);stroke:var(--ink);}#mmd-c37c03575db72d43-wide .edge-thickness-normal{stroke-width:1px;}#mmd-c37c03575db72d43-wide .edge-thickness-thick{stroke-width:3.5px;}#mmd-c37c03575db72d43-wide .edge-pattern-solid{stroke-dasharray:0;}#mmd-c37c03575db72d43-wide .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-c37c03575db72d43-wide .edge-pattern-dashed{stroke-dasharray:3;}#mmd-c37c03575db72d43-wide .edge-pattern-dotted{stroke-dasharray:2;}#mmd-c37c03575db72d43-wide .marker{fill:var(--muted);stroke:var(--muted);}#mmd-c37c03575db72d43-wide .marker.cross{stroke:var(--muted);}#mmd-c37c03575db72d43-wide svg{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:15px;}#mm