<svg id="mmd-d0f25e0f02890aa0-wide" width="100%" xmlns="http://www.w3.org/2000/svg" class="statediagram" style="max-width: 336.984375px;" viewBox="4 4 336.984375 478" role="graphics-document document" aria-roledescription="stateDiagram" aria-describedby="chart-desc-mmd-d0f25e0f02890aa0-wide" aria-labelledby="chart-title-mmd-d0f25e0f02890aa0-wide"><title id="chart-title-mmd-d0f25e0f02890aa0-wide">라이브 따라잡기의 세 모드</title><desc id="chart-desc-mmd-d0f25e0f02890aa0-wide">라이브 첫 진입과 실시간으로 버튼은 배속과 점프 모드로 시작한다. 되감기에서 라이브로 자동으로 넘어온 재생기는 배속만 모드로 시작하고, 넘김 확인이 끝나면 배속과 점프 모드로 오른다. 두 모드에서 시청자가 시크하거나 일시정지하거나 키로 옮기면 끔이 된다. 끔이나 배속만에서 실시간으로를 누르거나 끝 3초 안으로 시크하면 배속과 점프 모드가 된다. 넘김 확인 중에는 그래도 점프하지 않는다.</desc><style>#mmd-d0f25e0f02890aa0-wide{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:15px;fill:var(--ink);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-d0f25e0f02890aa0-wide .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-d0f25e0f02890aa0-wide .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-d0f25e0f02890aa0-wide .error-icon{fill:var(--bg);}#mmd-d0f25e0f02890aa0-wide .error-text{fill:var(--ink);stroke:var(--ink);}#mmd-d0f25e0f02890aa0-wide .edge-thickness-normal{stroke-width:1px;}#mmd-d0f25e0f02890aa0-wide .edge-thickness-thick{stroke-width:3.5px;}#mmd-d0f25e0f02890aa0-wide .edge-pattern-solid{stroke-dasharray:0;}#mmd-d0f25e0f02890aa0-wide .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-d0f25e0f02890aa0-wide .edge-pattern-dashed{stroke-dasharray:3;}#mmd-d0f25e0f02890aa0-wide .edge-pattern-dotted{stroke-dasharray:2;}#mmd-d0f25e0f02890aa0-wide .marker{fill:var(--muted);stroke:var(--muted);}#mmd-d0f25e0f02890aa0-wide .marker.cross{stroke:var(--muted);}#mmd-d0f25e0f02890aa0-wide svg{font-family:'Pretendard Variable',Pretendard,sans-seri