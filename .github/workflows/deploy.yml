name: Preserve old blog links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify new HTTPS site before replacing old pages
        run: |
          curl --fail --retry 3 --max-time 20 https://taeyun.blog/ -o /tmp/new-blog.html
          node --input-type=module -e "import fs from 'node:fs'; if (!fs.readFileSync('/tmp/new-blog.html', 'utf8').includes('https://taeyun.blog/')) process.exit(1)"
      - name: Validate article migration
        run: npm run build && npm test
      - name: Generate redirects and preserve static files
        run: node scripts/legacy-redirects.mjs .legacy-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .legacy-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy old-address redirects
        id: deployment
        uses: actions/deploy-pages@v4
