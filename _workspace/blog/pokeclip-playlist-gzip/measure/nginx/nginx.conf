# 압축 조건 재현용 nginx 설정(nginx:alpine 1.29.7). 서버마다 한 조건만 바꾼다.
#   8080 정적 파일(되감기 목록 · S3 객체 꼴)               — (a)
#   8081 상류 프록시 · proxy_buffering off · gzip 끔        — (b) 상자 nginx 와 같은 프록시 기본값
#   8082 상류 프록시 · proxy_buffering on  · gzip 끔        — (b) 대조: 버퍼링을 켜도 길이가 생기나
#   8083 상류 프록시 · buffering off · gzip on · gzip_proxied 기본(off) — (c)
#   8084 상류 프록시 · buffering off · gzip on · gzip_proxied any       — (c)
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_read_timeout 10s;

  server {
    listen 8080;
    root /srv/static;
  }

  server {
    listen 8081;
    proxy_buffering off;
    location / { proxy_pass http://127.0.0.1:8888; }
  }

  server {
    listen 8082;
    proxy_buffering on;
    location / { proxy_pass http://127.0.0.1:8888; }
  }

  server {
    listen 8083;
    proxy_buffering off;
    gzip on;
    gzip_types application/vnd.apple.mpegurl;
    location / { proxy_pass http://127.0.0.1:8888; }
  }

  server {
    listen 8084;
    proxy_buffering off;
    gzip on;
    gzip_types application/vnd.apple.mpegurl;
    gzip_proxied any;
    location / { proxy_pass http://127.0.0.1:8888; }
  }
}
