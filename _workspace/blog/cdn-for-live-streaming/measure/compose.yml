name: tb6-cdn
x-lab: &lab
  labels:
    com.techblog.bench: tb6-cdn
services:
  origin:
    image: python:3.12-alpine
    <<: *lab
    command: ["python", "-u", "/app/origin.py"]
    volumes: ["./origin.py:/app/origin.py:ro", "./log:/log"]
    networks: [net]
  shield:
    image: nginx:1-alpine
    <<: *lab
    volumes: ["./shield.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [net]
  edge1: &edge
    image: nginx:1-alpine
    <<: *lab
    volumes: ["./edge.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [net]
  edge2: *edge
  edge3: *edge
  edge4: *edge
  client:
    image: python:3.12-alpine
    <<: *lab
    command: ["sleep", "infinity"]
    volumes: ["./client.py:/app/client.py:ro", "./out:/out"]
    networks: [net]
networks:
  net:
    labels:
      com.techblog.bench: tb6-cdn
