proxy_cache_path /var/cache/nginx/c levels=1:2 keys_zone=c:10m max_size=2g inactive=10m use_temp_path=off;
log_format t '$msec $remote_addr "$request" $status $upstream_cache_status $request_time';
access_log /dev/stdout t;
server {
  listen 8080;
  proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Hop shield;
  proxy_cache c; proxy_cache_valid 200 60s; proxy_cache_valid 404 10s;
  add_header X-Cache-Shield $upstream_cache_status always;
  location /lock/   { proxy_pass http://origin:8000; proxy_cache_lock on;  proxy_cache_lock_timeout 10s; proxy_cache_lock_age 10s; }
  location /nolock/ { proxy_pass http://origin:8000; proxy_cache_lock off; }
}
